<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ kiến trúc Meibook</title>
  <desc id="desc">Sơ đồ mô tả Client, FastAPI Backend, RAG Pipeline, MES Database, LangGraph Agent, LiteLLM và các model.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .system { fill: #fbfbd9; stroke: #e8e95f; stroke-width: 2; }
      .models-zone { fill: #fbfbd9; stroke: #e8e95f; stroke-width: 2; }
      .node { fill: #eeeafb; stroke: #a78bfa; stroke-width: 1.7; }
      .node-green { fill: #dcfce7; stroke: #22c55e; stroke-width: 2.2; }
      .db { fill: #eeeafb; stroke: #a78bfa; stroke-width: 1.7; }
      .text { font: 600 16px "Noto Sans CJK JP", "Noto Sans JP", Arial, sans-serif; fill: #3f3f46; }
      .small { font: 600 14px "Noto Sans CJK JP", "Noto Sans JP", Arial, sans-serif; fill: #52525b; }
      .label-bg { fill: #e5e7eb; opacity: 0.94; }
      .label { font: 600 14px "Noto Sans CJK JP", "Noto Sans JP", Arial, sans-serif; fill: #4b5563; }
      .zone-title { font: 600 15px "Noto Sans CJK JP", "Noto Sans JP", Arial, sans-serif; fill: #4b5563; }
      .arrow { stroke: #5f6368; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #33363b; stroke-width: 1.6; fill: none; marker-end: url(#arrow-soft); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5f6368" />
    </marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#33363b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900" />

  <!-- Client layer -->
  <rect class="node" x="770" y="8" width="172" height="34" rx="17" />
