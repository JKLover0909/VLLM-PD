  <rect class="label-bg" x="935" y="575" width="76" height="22" />
  <text class="label" x="973" y="592" text-anchor="middle">grok-model</text>

  <rect class="label-bg" x="1045" y="548" width="126" height="22" />
  <text class="label" x="1108" y="565" text-anchor="middle">local-gemma / coding</text>

