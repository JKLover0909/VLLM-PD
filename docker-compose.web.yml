services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: meibook-web:latest
    container_name: meibook-web
    gpus: all
    env_file:
      - ${MEIBOOK_ENV_FILE:-.env.docker}
    environment:
      ENABLE_AGENT: "false"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      LITELLM_URL: http://litellm:4000/v1
      UPLOAD_DIR: /app/uploads
      MKAC_SOURCE_DIR: /app/documents/MKAC
      MKAC_MANIFEST_PATH: /app/config/mkac_manifest.json
      MKAC_PAGE_IMAGE_DIR: /app/mkac_processed/pages
      MKAC_INDEX_REPORT: /app/logs/mkac_index_report.json
      RESEARCH_DEMO_DIR: /app/documents/Research
      RESEARCH_DEMO_SESSION_ID: 00000000-0000-4000-8000-000000000001
      RESEARCH_DEMO_INDEX_REPORT: /app/logs/research_demo_index_report.json
      EMPLOYEE_DIRECTORY_SOURCE_DIR: /app/documents/MKAC
      EMPLOYEE_DIRECTORY_SOURCE_GLOB: "3. DANH SÁCH KHÁM SỨC KHOẺ 2026.pdf"
      EMPLOYEE_DIRECTORY_DB_PATH: /app/data/employee_directory.sqlite
      EMPLOYEE_DIRECTORY_SUMMARY_PATH: "/app/documents/MKAC/0. Thong tin nhan su va lanh dao MKAC.html"
      MES_DATABASE_ENABLED: "true"
      MES_DATABASE_PATH: /app/data/mes.sqlite
      MES_SQL_AGENT_ENABLED: "true"
      MES_SEMANTIC_MODEL_PATH: /app/config/mes_semantic_model.json
      MES_SQL_AGENT_MAX_ROWS: "100"
      MES_SQL_AGENT_TIMEOUT: "2"
      MES_SQL_AGENT_MAX_ATTEMPTS: "2"
      MES_SQL_AGENT_MODEL: local-qwen-coder
      LOCAL_CHAT_NUM_CTX: "16384"
    ports:
      - "${MACHINE2_API_PORT:-8001}:8001"
    volumes:
      - easyocr_cache:/root/.EasyOCR
      - ./documents/MKAC:/app/documents/MKAC
      - ./documents/Research:/app/documents/Research:ro
      - ./config:/app/config
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./logs:/app/logs
      - ./mkac_processed:/app/mkac_processed
      - hf_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
    depends_on:
      - qdrant
      - litellm
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: meibook-qdrant
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  litellm:
    build:
      context: .
      dockerfile: Dockerfile.litellm
    image: meibook-litellm:latest
    container_name: meibook-litellm
    env_file:
      - ${MEIBOOK_ENV_FILE:-.env.docker}
    environment:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      OLLAMA_API_BASE: https://carless-overarch-establish.ngrok-free.dev
      QWEN_CHAT_API_BASE: https://carless-overarch-establish.ngrok-free.dev
      QWEN_CODER_API_BASE: https://d3d2-2405-4803-f16d-d2f0-b282-e2ff-fe05-dfe9.ngrok-free.app/v1
      QWEN_CODER_API_KEY: sk-local
    command: ["--local", "--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:${LITELLM_PROXY_PORT:-4000}:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  hf_cache:
  torch_cache:
  easyocr_cache:
