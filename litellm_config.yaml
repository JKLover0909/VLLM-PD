model_list:
  # Qwen is one remote primary configured over TLS/VPN. The HTTP-only LAN
  # endpoint is intentionally not embedded here or activated by default.
  # Thinking control must be applied only to the Qwen primary, never Azure.
  - model_name: auto-model
    litellm_params:
      model: os.environ/REMOTE_LLM_MODEL
      custom_llm_provider: openai
      api_base: os.environ/REMOTE_LLM_API_BASE
      api_key: os.environ/REMOTE_LLM_API_KEY
      timeout: 120
      allowed_openai_params: ["extra_body"]
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
      stream: true
      max_parallel_requests: 1
    model_info:
      max_input_tokens: 8192
      max_output_tokens: 4096
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      cache_creation_input_token_cost: 0.0
      cache_read_input_token_cost: 0.0

  - model_name: local-qwen-chat
    litellm_params:
      model: os.environ/REMOTE_LLM_MODEL
      custom_llm_provider: openai
      api_base: os.environ/REMOTE_LLM_API_BASE
      api_key: os.environ/REMOTE_LLM_API_KEY
      timeout: 120
      allowed_openai_params: ["extra_body"]
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
      stream: true
      max_parallel_requests: 1
    model_info:
      max_input_tokens: 8192
      max_output_tokens: 4096
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      cache_creation_input_token_cost: 0.0
      cache_read_input_token_cost: 0.0

  - model_name: local-qwen-coder
    litellm_params:
      model: os.environ/REMOTE_LLM_MODEL
      custom_llm_provider: openai
      api_base: os.environ/REMOTE_LLM_API_BASE
      api_key: os.environ/REMOTE_LLM_API_KEY
      timeout: 120
      allowed_openai_params: ["extra_body"]
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
      stream: true
      max_parallel_requests: 1
    model_info:
      max_input_tokens: 8192
      max_output_tokens: 4096
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      cache_creation_input_token_cost: 0.0
      cache_read_input_token_cost: 0.0

  - model_name: azure-chat-fallback
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      timeout: 120
      max_parallel_requests: 1

  - model_name: azure-coder-fallback
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      timeout: 120
      max_parallel_requests: 1

  # Coding Agent retains its logical alias on the shared remote primary.
  - model_name: coding-model
    litellm_params:
      model: os.environ/REMOTE_LLM_MODEL
      custom_llm_provider: openai
      api_base: os.environ/REMOTE_LLM_API_BASE
      api_key: os.environ/REMOTE_LLM_API_KEY
      timeout: 120
      allowed_openai_params: ["extra_body"]
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
      stream: true
      max_parallel_requests: 1
    model_info:
      max_input_tokens: 8192
      max_output_tokens: 4096
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      cache_creation_input_token_cost: 0.0
      cache_read_input_token_cost: 0.0

router_settings:
  fallbacks:
    # Azure is called only when the shared remote Qwen primary fails.
    - auto-model: ["azure-chat-fallback"]
    - local-qwen-chat: ["azure-chat-fallback"]
    - local-qwen-coder: ["azure-coder-fallback"]
    - coding-model: ["azure-coder-fallback"]
  num_retries: 1
  timeout: 120
  routing_strategy: simple-shuffle

litellm_settings:
  # Bound total upstream traffic so bursts from public users apply backpressure
  # instead of opening an unbounded number of model requests.
  global_max_parallel_requests: 8
