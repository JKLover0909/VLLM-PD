model_list:
  # Default web route. Qwen3 must use LiteLLM's ollama_chat provider against
  # the Ollama root URL, not Ollama's OpenAI-compatible /v1 endpoint.
  - model_name: auto-model
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: os.environ/QWEN_CHAT_API_BASE
      headers:
        ngrok-skip-browser-warning: "true"
      timeout: 12
      stream: true
      max_parallel_requests: 1
    model_info:
      max_input_tokens: 16384
      max_output_tokens: 4096
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      cache_creation_input_token_cost: 0.0
      cache_read_input_token_cost: 0.0

  # Local Qwen3 chat model served by the external Ollama host. Use the
  # official Ollama qwen3:14b tag because it includes the correct chat
  # template, stop tokens, and thinking controls. Do not point
  # QWEN_CHAT_API_BASE to /v1; direct Ollama /v1 may return reasoning with
  # empty message content for Qwen3.
  - model_name: local-qwen-chat
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: os.environ/QWEN_CHAT_API_BASE
      headers:
        ngrok-skip-browser-warning: "true"
      timeout: 120
      stream: true
      max_parallel_requests: 1
    model_info:
      max_input_tokens: 16384
      max_output_tokens: 4096
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      cache_creation_input_token_cost: 0.0
      cache_read_input_token_cost: 0.0

  # Small local helper model for cheap tasks such as short translation, intent
  # classification, query rewrite, and answer formatting. It runs on the
  # Machine 2 Ollama system service, so it stays available after SSH exits.
  - model_name: local-qwen-small
    litellm_params:
      model: ollama_chat/qwen2.5:3b-instruct
      api_base: os.environ/QWEN_SMALL_API_BASE
      timeout: 30
      stream: true
      max_parallel_requests: 2
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 1024
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      cache_creation_input_token_cost: 0.0
      cache_read_input_token_cost: 0.0

  # Local Qwen Coder served by llama.cpp's OpenAI-compatible API.
  - model_name: local-qwen-coder
    litellm_params:
      model: openai//home/jkl0909/models/qwen2.5-coder-14b/Qwen2.5-Coder-14B-Instruct-Q5_K_M.gguf
      api_base: os.environ/QWEN_CODER_API_BASE
      api_key: os.environ/QWEN_CODER_API_KEY
      headers:
        ngrok-skip-browser-warning: "true"
      timeout: 120
      stream: true
      max_parallel_requests: 1
    model_info:
      max_input_tokens: 16384
      max_output_tokens: 4096
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      cache_creation_input_token_cost: 0.0
      cache_read_input_token_cost: 0.0

  # Local Gemma4 served by Machine 1 through the internal LAN.
  - model_name: local-gemma
    litellm_params:
      model: ollama/gemma4:latest
      api_base: os.environ/OLLAMA_API_BASE
      timeout: 120
      stream: true
      max_parallel_requests: 1
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 4096
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      cache_creation_input_token_cost: 0.0
      cache_read_input_token_cost: 0.0

  # Cloud providers selectable from the web UI.
  - model_name: openai-model
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 120

  - model_name: grok-model
    litellm_params:
      model: openai/grok-4-20-reasoning
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      timeout: 120

  # Coding Agent keeps a stable logical name.
  - model_name: coding-model
    litellm_params:
      model: openai//home/jkl0909/models/qwen2.5-coder-14b/Qwen2.5-Coder-14B-Instruct-Q5_K_M.gguf
      api_base: os.environ/QWEN_CODER_API_BASE
      api_key: os.environ/QWEN_CODER_API_KEY
      headers:
        ngrok-skip-browser-warning: "true"
      timeout: 120
      stream: true
      max_parallel_requests: 1
    model_info:
      max_input_tokens: 16384
      max_output_tokens: 4096
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      cache_creation_input_token_cost: 0.0
      cache_read_input_token_cost: 0.0

router_settings:
  fallbacks:
    - auto-model: ["openai-model", "grok-model"]
    - local-qwen-small: ["local-qwen-chat"]
    - coding-model: ["local-qwen-coder", "local-qwen-chat"]
  num_retries: 1
  timeout: 120
  routing_strategy: simple-shuffle

litellm_settings:
  # Bound total upstream traffic so bursts from public users apply backpressure
  # instead of opening an unbounded number of model requests.
  global_max_parallel_requests: 8
