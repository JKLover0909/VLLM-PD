model_list:
  # Default web route. OpenAI is primary for the basic MKAC chat.
  - model_name: auto-model
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 120

  # Local Gemma4 served by Machine 1 through ngrok.
  - model_name: local-gemma
    litellm_params:
      model: ollama/gemma4:latest
      api_base: os.environ/OLLAMA_API_BASE
      timeout: 120
      stream: true
      max_parallel_requests: 1
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 4096

  # Cloud providers selectable from the web UI.
  - model_name: openai-model
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 120

  - model_name: grok-model
    litellm_params:
      model: openai/grok-4-20-reasoning
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      timeout: 120

  # Coding Agent keeps a stable logical name.
  - model_name: coding-model
    litellm_params:
      model: ollama/gemma4:latest
      api_base: os.environ/OLLAMA_API_BASE
      timeout: 120
      stream: true
      max_parallel_requests: 1
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 4096

router_settings:
  fallbacks:
    - auto-model: ["grok-model", "local-gemma"]
    - coding-model: ["openai-model"]
  num_retries: 1
  timeout: 120
  routing_strategy: simple-shuffle

litellm_settings:
  # Bound total upstream traffic so bursts from public users apply backpressure
  # instead of opening an unbounded number of model requests.
  global_max_parallel_requests: 8
